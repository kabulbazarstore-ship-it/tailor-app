<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tailor | خیاط‌یار</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- ⭐ اعمال تم قبل از رندر (جلوگیری از فلش) -->
    <script>
        (function() {
            try {
                document.documentElement.setAttribute(
                    'data-theme', 
                    localStorage.getItem('tailor-theme') || 'dark'
                );
            } catch(e) {}
        })();
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* ================== تم تاریک (پیش‌فرض) ================== */
        :root {
            --bg-body: radial-gradient(circle at top, #0a261d 0%, #050b09 100%);
            --bg-panel: linear-gradient(180deg, #0a1c16 0%, #040b09 100%);
            --text-main: #ffffff;
            --text-muted: #78909c;
            --gold: #d4af37;
            --gold-light: #f3d58b;
            --border: rgba(212, 175, 55, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.4);
            --overlay-bg: rgba(0,0,0,0.8);
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
            --theme-btn-bg: #0a1c16;
            --theme-btn-text: #f3d58b;
        }
        
        /* ================== تم روشن ================== */
        [data-theme="light"] {
            --bg-body: radial-gradient(circle at top, #faf3e0 0%, #eadfc5 100%);
            --bg-panel: linear-gradient(180deg, #ffffff 0%, #faf3e0 100%);
            --text-main: #1a1a1a;
            --text-muted: #5a5a5a;
            --gold: #a67c00;
            --gold-light: #d4af37;
            --border: rgba(166, 124, 0, 0.4);
            --danger: #c62828;
            --success: #2e7d32;
            --input-bg: rgba(255, 255, 255, 0.9);
            --overlay-bg: rgba(0,0,0,0.5);
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --theme-btn-bg: #ffffff;
            --theme-btn-text: #a67c00;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ⭐ دکمه تغییر تم (در همه صفحات) */
        #theme-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--theme-btn-bg);
            border: 1px solid var(--border);
            color: var(--theme-btn-text);
            cursor: pointer;
            z-index: 9999;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        #theme-toggle:active { transform: scale(0.9); }
        
        /* ================== اسپلش ================== */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s ease;
        }
        .glow-logo {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            border: 2px solid var(--gold);
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(212, 175, 55, 0.2);
            animation: pulse-logo 1.5s ease-in-out infinite;
        }
        @keyframes pulse-logo {
            0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.4); transform: scale(1); }
            50%      { box-shadow: 0 0 45px rgba(212,175,55,0.7); transform: scale(1.03); }
        }
        .splash-title {
            color: var(--gold);
            font-size: 28px;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .splash-name {
            color: var(--text-main);
            font-size: 16px;
            margin-top: 12px;
            font-weight: bold;
            min-height: 22px;
        }
        .loader-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ================== صفحات ================== */
        .view-section { display: none; }
        .view-section.active { display: block; }
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .header-title h1 { color: var(--gold); font-size: 22px; margin-bottom: 5px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--gold); }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #000; }
        .btn-link { background: none; border: none; color: var(--gold); font-size: 13px; cursor: pointer; width: 100%; text-align: center; padding: 8px; }
        
        /* ================== قفل ================== */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            z-index: 9998;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .lock-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-main);
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        /* ================== پیام‌رسان ================== */
        .custom-alert-overlay {
            position: fixed; inset: 0;
            background: var(--overlay-bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .custom-alert-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-alert-box {
            background: var(--bg-panel);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            width: 85%; max-width: 320px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .custom-alert-title { color: var(--gold); font-size: 18px; margin-bottom: 10px; }
        .custom-alert-msg { font-size: 13px; margin-bottom: 15px; color: var(--text-main); }
        .custom-alert-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ⭐ دکمه تغییر تم -->
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم">☀️</button>

    <!-- ⭐ اسپلش -->
    <div id="splash-screen">
        <div class="glow-logo">✂️</div>
        <h1 class="splash-title">Tailor</h1>
        <h2 class="splash-name" id="splash-user-name">خیاط‌یار</h2>
        <div class="loader-spinner"></div>
    </div>

    <!-- پیام‌رسان -->
    <div class="custom-alert-overlay" id="custom-alert">
        <div class="custom-alert-box">
            <h3 class="custom-alert-title" id="alert-title">عنوان</h3>
            <p class="custom-alert-msg" id="alert-msg">پیام</p>
            <button class="custom-alert-btn" onclick="document.getElementById('custom-alert').classList.remove('active')">تایید</button>
        </div>
    </div>

    <div class="app-container">
        
        <!-- ورود -->
        <div id="view-login" class="view-section active">
            <div class="card">
                <div class="header-title"><h1>ورود به برنامه</h1></div>
                <div class="form-group"><label>ایمیل</label><input type="email" id="login-email" placeholder="example@mail.com" autocomplete="email"></div>
                <div class="form-group"><label>رمز عبور</label><input type="password" id="login-pass" placeholder="رمز عبور" autocomplete="current-password"></div>
                <button class="btn btn-primary" onclick="loginUser()">ورود</button>
                <button class="btn-link" onclick="switchView('register')">حساب ندارید؟ ثبت‌نام کنید</button>
            </div>
        </div>

        <!-- ثبت‌نام -->
        <div id="view-register" class="view-section">
            <div class="card">
                <div class="header-title"><h1>ایجاد حساب جدید</h1></div>
                <div class="form-group"><label>نام خیاطی</label><input type="text" id="reg-tailor" placeholder="مثلا خیاطی احمدی"></div>
                <div class="form-group"><label>شماره تماس</label><input type="tel" id="reg-phone" placeholder="07XXXXXXXX"></div>
                <div class="form-group"><label>ایمیل</label><input type="email" id="reg-email" placeholder="example@mail.com" autocomplete="email"></div>
                <div class="form-group"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input type="password" id="reg-pass" placeholder="رمز عبور" autocomplete="new-password"></div>
                <button class="btn btn-primary" onclick="registerUser()">ثبت‌نام و شروع ۳۰ روز رایگان</button>
                <button class="btn-link" onclick="switchView('login')">قبلاً حساب دارید؟ ورود</button>
            </div>
        </div>

        <!-- داشبورد -->
        <div id="view-dashboard" class="view-section">
            <h2 style="color:var(--gold); text-align:center; margin-top:50px;">خوش آمدید به داشبورد!</h2>
            <p style="text-align:center; color:var(--text-muted); margin-top:10px;" id="dash-message"></p>
        </div>

    </div>

    <!-- قفل -->
    <div id="lock-screen">
        <h2 style="color:var(--danger); margin-bottom:10px;">اشتراک تمام شده است</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">دوره ۳۰ روزه به پایان رسیده. لطفاً پرداخت کنید.</p>
        <a href="payment.html" class="btn btn-primary" style="text-decoration:none; width:100%; max-width:300px; text-align:center; display:block;">پرداخت اشتراک</a>
        <div style="margin-top:20px; width:100%; max-width:300px;">
            <input type="text" id="lock-code-input" class="lock-input" placeholder="کد فعال‌سازی">
            <button class="btn btn-primary" onclick="activateAccount()">فعال‌سازی</button>
        </div>
    </div>

    <script>
        // ============ Firebase ============
        const firebaseConfig = {
            apiKey: "AIzaSyDeuBpobxA5NNZZZ0ieu2-WLn-jJgxxdkk",
            authDomain: "tailor-64f7f.firebaseapp.com",
            databaseURL: "https://tailor-64f7f-default-rtdb.firebaseio.com",
            projectId: "tailor-64f7f",
            storageBucket: "tailor-64f7f.firebasestorage.app",
            messagingSenderId: "16067911685",
            appId: "1:16067911685:web:1b76892edf61b6a4923c6c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        // ⭐ ورود ماندگار (حتی بعد از بستن مرورگر)
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);
        
        // ============ State ============
        let currentPhone = null;
        let appInitialized = false;
        const SPLASH_MIN_MS = 500;          // ⭐ نیم ثانیه
        const splashStart = Date.now();
        
        // ============ تم ============
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('tailor-theme', theme); } catch(e) {}
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
        }
        
        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(cur === 'dark' ? 'light' : 'dark');
        }
        
        // ============ Helpers ============
        function showAlert(title, msg) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('custom-alert').classList.add('active');
        }
        
        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            const t = document.getElementById('view-' + view);
            if (t) t.classList.add('active');
        }
        
        function hideSplash(after) {
            const elapsed = Date.now() - splashStart;
            const remaining = Math.max(0, SPLASH_MIN_MS - elapsed);
            setTimeout(function() {
                const s = document.getElementById('splash-screen');
                s.style.opacity = '0';
                setTimeout(function() {
                    s.style.display = 'none';
                    if (after) after();
                }, 250);
            }, remaining);
        }
        
        // ============ ورود ============
        function loginUser() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            if (!email || !pass) return showAlert('خطا', 'ایمیل و رمز عبور را وارد کنید');
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch(function(err) {
                    if (err.code === 'auth/configuration-not-found') {
                        showAlert('خطا در تنظیمات', 'در پنل Firebase گزینه Email/Password را فعال کنید.');
                    } else if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                        showAlert('خطا', 'ایمیل یا رمز عبور اشتباه است.');
                    } else {
                        showAlert('خطا', err.message || 'ورود ناموفق بود');
                    }
                });
        }
        
        // ============ ثبت‌نام (با ورود خودکار) ============
        function registerUser() {
            const name = document.getElementById('reg-tailor').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            
            if (!name || !phone || !email || !pass) return showAlert('خطا', 'لطفاً همه فیلدها را پر کنید');
            if (pass.length < 6) return showAlert('خطا', 'رمز عبور حداقل ۶ کاراکتر باشد');
            
            db.ref('users/' + phone).once('value').then(function(snap) {
                if (snap.exists()) return showAlert('خطا', 'این شماره قبلاً ثبت شده است');
                
                auth.createUserWithEmailAndPassword(email, pass)
                    .then(function(userCred) {
                        const uid = userCred.user.uid;
                        const trialEnd = Date.now() + (30 * 24 * 60 * 60 * 1000);
                        const data = {
                            uid: uid, tailorName: name, phone: phone, email: email,
                            subscription: { status: 'trial', endDate: trialEnd }
                        };
                        return Promise.all([
                            db.ref('users_auth/' + uid).set({ phone: phone, tailorName: name }),
                            db.ref('users/' + phone).set(data)
                        ]).then(function() { return { name: name, phone: phone }; });
                    })
                    .then(function(result) {
                        // ⭐ ورود خودکار - بدون reload، بدون نیاز به رمز مجدد
                        currentPhone = result.phone;
                        appInitialized = true;
                        document.querySelector('.app-container').style.display = 'flex';
                        document.getElementById('lock-screen').style.display = 'none';
                        switchView('dashboard');
                        document.getElementById('dash-message').innerText =
                            'سلام ' + result.name + ' عزیز، ۳۰ روز رایگان شما فعال شد.';
                    })
                    .catch(function(err) {
                        if (err.code === 'auth/configuration-not-found') {
                            showAlert('خطا در تنظیمات', 'در پنل Firebase گزینه Email/Password را فعال کنید.');
                        } else if (err.code === 'auth/email-already-in-use') {
                            showAlert('خطا', 'این ایمیل قبلاً ثبت شده است.');
                        } else if (err.code === 'auth/weak-password') {
                            showAlert('خطا', 'رمز عبور حداقل ۶ کاراکتر باشد.');
                        } else {
                            showAlert('خطا', err.message || 'ثبت‌نام ناموفق بود');
                        }
                    });
            }).catch(function(err) {
                showAlert('خطا', 'خطا در ارتباط با سرور: ' + (err.message || ''));
            });
        }
        
        // ============ فعال‌سازی ============
        function activateAccount() {
            const code = document.getElementById('lock-code-input').value.trim();
            if (!code) return showAlert('خطا', 'کد را وارد کنید');
            if (!currentPhone) return showAlert('خطا', 'ابتدا وارد حساب شوید');
            
            db.ref('activation_codes/' + code).once('value').then(function(snap) {
                const data = snap.val();
                if (!data) return showAlert('خطا', 'کد نامعتبر است');
                if (data.isUsed) return showAlert('خطا', 'کد قبلاً استفاده شده');
                if (data.phone !== currentPhone) return showAlert('خطا', 'کد مخصوص شما نیست');
                
                const newEnd = Date.now() + (30 * 24 * 60 * 60 * 1000);
                return db.ref('users/' + currentPhone + '/subscription')
                    .update({ status: 'active', endDate: newEnd })
                    .then(function() { return db.ref('activation_codes/' + code).update({ isUsed: true }); })
                    .then(function() {
                        showAlert('موفق', 'حساب شما فعال شد');
                        setTimeout(function() { window.location.reload(); }, 1500);
                    });
            });
        }
        
        // ============ شروع ============
        window.addEventListener('load', function() {
            // اعمال تم ذخیره‌شده
            applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            
            auth.onAuthStateChanged(function(user) {
                if (appInitialized) return;
                appInitialized = true;
                
                if (user) {
                    db.ref('users_auth/' + user.uid).once('value').then(function(snap) {
                        if (snap.exists()) {
                            currentPhone = snap.val().phone;
                            const name = snap.val().tailorName || 'کاربر';
                            document.getElementById('splash-user-name').innerText = name;
                            
                            db.ref('users/' + currentPhone + '/subscription').once('value').then(function(subSnap) {
                                const sub = subSnap.val();
                                hideSplash(function() {
                                    if (sub && Date.now() > sub.endDate) {
                                        document.querySelector('.app-container').style.display = 'none';
                                        document.getElementById('lock-screen').style.display = 'flex';
                                    } else {
                                        document.querySelector('.app-container').style.display = 'flex';
                                        switchView('dashboard');
                                        document.getElementById('dash-message').innerText =
                                            'سلام ' + name + ' عزیز، سیستم شما فعال است.';
                                    }
                                });
                            }).catch(function() {
                                hideSplash(function() { switchView('login'); });
                            });
                        } else {
                            // کاربر احراز شده ولی داده‌اش نیست (نادر)
                            auth.signOut().then(function() {
                                hideSplash(function() {
                                    switchView('login');
                                    showAlert('توجه', 'اطلاعات حساب کامل نیست. لطفاً دوباره ثبت‌نام کنید.');
                                });
                            });
                        }
                    }).catch(function() {
                        hideSplash(function() { switchView('login'); });
                    });
                } else {
                    hideSplash(function() { switchView('login'); });
                }
            });
        });
    </script>
</body>
</html>
