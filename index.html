<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tailor | خیاط‌یار</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Firebase Core, Auth, Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --bg-body: radial-gradient(circle at top, #0a261d 0%, #050b09 100%);
            --bg-panel: linear-gradient(180deg, #0a1c16 0%, #040b09 100%);
            --text-main: #ffffff;
            --text-muted: #78909c;
            --gold: #d4af37;
            --gold-light: #f3d58b;
            --border: rgba(212, 175, 55, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 420px; padding: 15px; position: relative; min-height: 100vh; display: flex; flex-direction: column; }

        /* لودینگ اولیه */
        #splash-screen { position: fixed; inset: 0; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .glow-logo { width: 100px; height: 100px; border-radius: 25px; border: 2px solid var(--gold); background: #000; }
        .splash-title { color: var(--gold); font-size: 24px; margin-top: 15px; font-weight: bold; }
        .splash-name { color: var(--text-main); font-size: 16px; margin-top: 10px; font-weight: bold; }
        .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* صفحات */
        .view-section { display: none; }
        .view-section.active { display: block; }
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 25px 20px; margin-bottom: 20px; }
        .header-title h1 { color: var(--gold); font-size: 22px; margin-bottom: 5px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
        .input-box input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text-main); font-size: 13px; outline: none; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #000; }
        .btn-link { background: none; border: none; color: var(--gold); font-size: 13px; cursor: pointer; width: 100%; text-align: center; }

        /* قفل صفحه */
        #lock-screen { position: fixed; inset: 0; background: var(--bg-body); z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .lock-input { width: 100%; max-width: 300px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); text-align: center; margin-bottom: 10px; }

        /* پیام‌رسان */
        .custom-alert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .custom-alert-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-alert-box { background: var(--bg-panel); border: 1px solid var(--gold); border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center; }
        .custom-alert-title { color: var(--gold); font-size: 18px; margin-bottom: 10px; }
        .custom-alert-msg { font-size: 13px; margin-bottom: 15px; }
        .custom-alert-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- لودینگ -->
    <div id="splash-screen">
        <div class="glow-logo"></div>
        <h1 class="splash-title">Tailor</h1>
        <h2 class="splash-name" id="splash-user-name"></h2>
        <div class="loader-spinner"></div>
    </div>

    <!-- پیام‌رسان -->
    <div class="custom-alert-overlay" id="custom-alert">
        <div class="custom-alert-box">
            <h3 class="custom-alert-title" id="alert-title">عنوان</h3>
            <p class="custom-alert-msg" id="alert-msg">پیام</p>
            <button class="custom-alert-btn" onclick="document.getElementById('custom-alert').classList.remove('active')">تایید</button>
        </div>
    </div>

    <div class="app-container">
        
        <!-- صفحه ورود -->
        <div id="view-login" class="view-section active">
            <div class="card">
                <div class="header-title"><h1>ورود به برنامه</h1></div>
                <div class="form-group"><label>ایمیل</label><input type="email" id="login-email" placeholder="example@mail.com"></div>
                <div class="form-group"><label>رمز عبور</label><input type="password" id="login-pass" placeholder="رمز عبور"></div>
                <button class="btn btn-primary" onclick="loginUser()">ورود</button>
                <button class="btn-link" onclick="switchView('register')">حساب ندارید؟ ثبت‌نام کنید</button>
            </div>
        </div>

        <!-- صفحه ثبت‌نام -->
        <div id="view-register" class="view-section">
            <div class="card">
                <div class="header-title"><h1>ایجاد حساب جدید</h1></div>
                <div class="form-group"><label>نام خیاطی</label><input type="text" id="reg-tailor" placeholder="مثلا خیاطی احمدی"></div>
                <div class="form-group"><label>شماره تماس</label><input type="tel" id="reg-phone" placeholder="07XXXXXXXX"></div>
                <div class="form-group"><label>ایمیل</label><input type="email" id="reg-email" placeholder="example@mail.com"></div>
                <div class="form-group"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input type="password" id="reg-pass" placeholder="رمز عبور"></div>
                <button class="btn btn-primary" onclick="registerUser()">ثبت‌نام و شروع ۳۰ روز رایگان</button>
                <button class="btn-link" onclick="switchView('login')">قبلاً حساب دارید؟ ورود</button>
            </div>
        </div>

        <!-- داشبورد -->
        <div id="view-dashboard" class="view-section">
            <h2 style="color:var(--gold); text-align:center; margin-top:50px;">خوش آمدید به داشبورد!</h2>
            <p style="text-align:center; color:var(--text-muted); margin-top:10px;" id="dash-message"></p>
        </div>

    </div>

    <!-- صفحه قفل -->
    <div id="lock-screen">
        <h2 style="color:var(--danger); margin-bottom:10px;">اشتراک تمام شده است</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">دوره ۳۰ روزه به پایان رسیده. لطفاً پرداخت کنید.</p>
        <a href="payment.html" class="btn btn-primary" style="text-decoration:none; width:100%; max-width:300px; text-align:center;">پرداخت اشتراک</a>
        <div style="margin-top:20px; width:100%; max-width:300px;">
            <input type="text" id="lock-code-input" class="lock-input" placeholder="کد فعال‌سازی">
            <button class="btn btn-primary" onclick="activateAccount()">فعال‌سازی</button>
        </div>
    </div>

    <script>
        // ================= تنظیمات فایربیس =================
        const firebaseConfig = {
            apiKey: "AIzaSyDeuBpobxA5NNZZZ0ieu2-WLn-jJgxxdkk",
            authDomain: "tailor-64f7f.firebaseapp.com",
            databaseURL: "https://tailor-64f7f-default-rtdb.firebaseio.com",
            projectId: "tailor-64f7f",
            storageBucket: "tailor-64f7f.firebasestorage.app",
            messagingSenderId: "16067911685",
            appId: "1:16067911685:web:1b76892edf61b6a4923c6c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        // فعال‌سازی ذخیره‌سازی محلی برای ورود خودکار
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        let currentPhone = null;

        function showAlert(title, msg) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('custom-alert').classList.add('active');
        }

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
        }

        // ================= ثبت‌نام =================
        function registerUser() {
            const name = document.getElementById('reg-tailor').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            if (!name || !phone || !email || !pass) return showAlert('خطا', 'لطفاً همه فیلدها را پر کنید');

            db.ref('users/' + phone).once('value').then(snap => {
                if (snap.exists()) return showAlert('خطا', 'این شماره قبلاً ثبت شده است');

                auth.createUserWithEmailAndPassword(email, pass)
                    .then((userCred) => {
                        const uid = userCred.user.uid;
                        const trialEnd = Date.now() + (30 * 24 * 60 * 60 * 1000); // ۳۰ روز

                        // ذخیره اطلاعات
                        const data = {
                            uid: uid,
                            tailorName: name,
                            phone: phone,
                            email: email,
                            subscription: {
                                status: 'trial',
                                endDate: trialEnd
                            }
                        };

                        Promise.all([
                            db.ref('users_auth/' + uid).set({ phone: phone, tailorName: name }),
                            db.ref('users/' + phone).set(data)
                        ]).then(() => {
                            window.location.reload();
                        });
                    })
                    .catch(err => {
                        if (err.code === 'auth/configuration-not-found') {
                            showAlert('خطا در تنظیمات', 'در پنل Firebase گزینه Email/Password را فعال کنید.');
                        } else if (err.code === 'auth/email-already-in-use') {
                            showAlert('خطا', 'این ایمیل قبلاً ثبت شده است.');
                        } else if (err.code === 'auth/weak-password') {
                            showAlert('خطا', 'رمز عبور حداقل ۶ کاراکتر باشد.');
                        } else {
                            showAlert('خطا', err.message);
                        }
                    });
            });
        }

        // ================= ورود =================
        function loginUser() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => {
                    if (err.code === 'auth/configuration-not-found') {
                        showAlert('خطا در تنظیمات', 'در پنل Firebase گزینه Email/Password را فعال کنید.');
                    } else {
                        showAlert('خطا', 'ایمیل یا رمز عبور اشتباه است.');
                    }
                });
        }

        // ================= فعال‌سازی اشتراک =================
        function activateAccount() {
            const code = document.getElementById('lock-code-input').value.trim();
            if (!code) return alert('کد را وارد کنید');

            db.ref('activation_codes/' + code).once('value').then(snap => {
                const data = snap.val();
                if (!data) return alert('کد نامعتبر است');
                if (data.isUsed) return alert('کد قبلاً استفاده شده');
                if (data.phone !== currentPhone) return alert('کد مخصوص شما نیست');

                const newEndDate = Date.now() + (30 * 24 * 60 * 60 * 1000);
                db.ref('users/' + currentPhone + '/subscription').update({
                    status: 'active',
                    endDate: newEndDate
                }).then(() => {
                    db.ref('activation_codes/' + code).update({ isUsed: true });
                    alert('حساب شما فعال شد');
                    window.location.reload();
                });
            });
        }

        // ================= بررسی وضعیت لاگین (Auto Login) =================
        window.onload = () => {
            auth.onAuthStateChanged((user) => {
                // ۱. نیم ثانیه صبر می‌کنیم تا نام کاربر در لودینگ نمایش داده شود
                setTimeout(() => {
                    document.getElementById('splash-screen').style.opacity = '0';
                    
                    setTimeout(() => {
                        document.getElementById('splash-screen').style.display = 'none';
                        
                        if (user) {
                            // کاربر لاگین است
                            db.ref('users_auth/' + user.uid).once('value').then(snap => {
                                if (snap.exists()) {
                                    currentPhone = snap.val().phone;
                                    const name = snap.val().tailorName;
                                    
                                    // نمایش نام در صفحه لودینگ
                                    document.getElementById('splash-user-name').innerText = name;
                                    
                                    // بررسی اشتراک
                                    db.ref('users/' + currentPhone + '/subscription').once('value').then(subSnap => {
                                        const sub = subSnap.val();
                                        if (sub && Date.now() > sub.endDate) {
                                            // زمان تمام شده
                                            document.querySelector('.app-container').style.display = 'none';
                                            document.getElementById('lock-screen').style.display = 'flex';
                                        } else {
                                            // زمان باقی مانده
                                            document.querySelector('.app-container').style.display = 'flex';
                                            switchView('dashboard');
                                            document.getElementById('dash-message').innerText = 'سلام ' + name + ' عزیز، سیستم شما فعال است.';
                                        }
                                    });
                                } else {
                                    switchView('login');
                                }
                            });
                        } else {
                            // کاربر لاگین نیست
                            switchView('login');
                        }
                    }, 300);
                }, 700); // زمان نیم ثانیه‌ای لودینگ
            });
        };
    </script>
</body>
</html>
