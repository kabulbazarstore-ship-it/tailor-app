<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tailor | گزارشات</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- کتابخانه‌های خروجی اکسل و PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-body: radial-gradient(circle at top, #0a261d 0%, #050b09 100%);
            --bg-panel: linear-gradient(180deg, #0a1c16 0%, #040b09 100%);
            --text-main: #ffffff;
            --text-muted: #78909c;
            --gold: #d4af37;
            --gold-light: #f3d58b;
            --border: rgba(212, 175, 55, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        body.light-mode {
            --bg-body: radial-gradient(circle at top, #e6dec9 0%, #d4cbb5 100%);
            --bg-panel: linear-gradient(180deg, #f4ecd8 0%, #ebe1cc 100%);
            --text-main: #1c2b26;
            --text-muted: #4a5a54;
            --border: rgba(212, 175, 55, 0.6);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; transition: background 0.3s, color 0.3s; }
        .app-container { width: 100%; max-width: 420px; padding: 15px; padding-bottom: 80px; display: flex; flex-direction: column; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; text-decoration: none; }
        .header-title { color: var(--gold); font-weight: bold; font-size: 18px; }
        .theme-toggle { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--border); color: var(--gold); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .theme-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

        /* تب‌ها */
        .tabs-container { display: flex; gap: 5px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #000; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* دکمه‌های خروجی */
        .export-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-export { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 12px; }
        .btn-excel { background: rgba(46, 213, 115, 0.1); color: var(--success); border: 1px solid var(--success); }
        .btn-pdf { background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        /* جدول گزارش */
        .table-container { overflow-x: auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 10px; text-align: right; font-size: 12px; border-bottom: 1px solid rgba(128,128,128,0.1); }
        th { background: rgba(212, 175, 55, 0.1); color: var(--gold); font-weight: bold; }
        td { color: var(--text-main); }
        tr:last-child td { border-bottom: none; }

        /* منوی پایین */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 15px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; width: 20%; text-decoration: none; }
        .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
        .nav-item span { font-size: 10px; }
        .nav-item.active { color: var(--gold); }
        
        /* لودینگ */
        .loading-text { text-align: center; padding: 20px; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">➔</a>
            <div class="header-title">گزارشات</div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn"><svg id="theme-icon" viewBox="0 0 24 24"></svg></button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="openTab('tab-orders', this)">سفارشات (مال جدید)</button>
            <button class="tab-btn" onclick="openTab('tab-production', this)">تولیدات کارگاه</button>
        </div>

        <!-- تب سفارشات -->
        <div id="tab-orders" class="tab-content active">
            <div class="export-btns">
                <button class="btn-export btn-excel" onclick="exportTableToExcel('orders-table', 'گزارش_سفارشات')">خروجی اکسل</button>
                <button class="btn-export btn-pdf" onclick="exportToPDF('orders-print-area', 'گزارش_سفارشات')">خروجی PDF</button>
            </div>
            <div class="table-container" id="orders-print-area">
                <table id="orders-table">
                    <thead>
                        <tr>
                            <th>تاریخ</th>
                            <th>مشتری</th>
                            <th>مدل</th>
                            <th>تعداد</th>
                            <th>مبلغ کل</th>
                            <th>پرداختی</th>
                            <th>باقی‌مانده</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="7" class="loading-text">در حال بارگذاری...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- تب تولیدات -->
        <div id="tab-production" class="tab-content">
            <div class="export-btns">
                <button class="btn-export btn-excel" onclick="exportTableToExcel('prod-table', 'گزارش_تولیدات')">خروجی اکسل</button>
                <button class="btn-export btn-pdf" onclick="exportToPDF('prod-print-area', 'گزارش_تولیدات')">خروجی PDF</button>
            </div>
            <div class="table-container" id="prod-print-area">
                <table id="prod-table">
                    <thead>
                        <tr>
                            <th>تاریخ</th>
                            <th>نوع</th>
                            <th>مسئول</th>
                            <th>تعداد</th>
                            <th>مبلغ کل</th>
                        </tr>
                    </thead>
                    <tbody id="prod-tbody">
                        <tr><td colspan="5" class="loading-text">در حال بارگذاری...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>خانه</span></a>
        <a href="production.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>تولید</span></a>
        <a href="students.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>شاگردان</span></a>
        <a href="report.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>گزارش</span></a>
        <a href="more.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span>بیشتر</span></a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDeuBpobxA5NNZZZ0ieu2-WLn-jJgxxdkk",
            authDomain: "tailor-64f7f.firebaseapp.com",
            databaseURL: "https://tailor-64f7f-default-rtdb.firebaseio.com",
            projectId: "tailor-64f7f",
            storageBucket: "tailor-64f7f.firebasestorage.app",
            messagingSenderId: "16067911685",
            appId: "1:16067911685:web:1b76892edf61b6a4923c6c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const userPhone = localStorage.getItem('tailor_user');

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-icon').innerHTML = isLight ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            localStorage.setItem('tailor_theme', isLight ? 'light' : 'dark');
        }

        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // بارگذاری سفارشات
        function loadOrdersReport() {
            database.ref('users/' + userPhone + '/orders').once('value').then(snapshot => {
                const data = snapshot.val();
                let tbody = document.getElementById('orders-tbody');
                
                if(!data) {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading-text">هیچ سفارشی یافت نشد.</td></tr>';
                    return;
                }
                
                let html = '';
                Object.values(data).sort((a,b) => b.timestamp - a.timestamp).forEach(o => {
                    html += `
                        <tr>
                            <td>${o.dates ? o.dates.given : '---'}</td>
                            <td>${o.customer || '---'}</td>
                            <td>${o.itemType || '---'}</td>
                            <td>${o.qtyTotal || 0}</td>
                            <td>${o.financials ? o.financials.total.toLocaleString() : 0}</td>
                            <td>${o.financials ? o.financials.paid.toLocaleString() : 0}</td>
                            <td style="color: var(--danger); font-weight: bold;">${o.financials ? o.financials.remaining.toLocaleString() : 0}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            });
        }

        // بارگذاری تولیدات
        function loadProductionReport() {
            database.ref('users/' + userPhone + '/production').once('value').then(snapshot => {
                const data = snapshot.val();
                let tbody = document.getElementById('prod-tbody');
                
                if(!data) {
                    tbody.innerHTML = '<tr><td colspan="5" class="loading-text">هیچ تولیدی یافت نشد.</td></tr>';
                    return;
                }
                
                let html = '';
                Object.values(data).sort((a,b) => b.timestamp - a.timestamp).forEach(p => {
                    let total = 0;
                    if(p.items) {
                        p.items.forEach(i => total += (Number(i.qty) * Number(i.price)));
                    }
                    html += `
                        <tr>
                            <td>${p.date || '---'}</td>
                            <td>${p.type || '---'}</td>
                            <td>${p.official || '---'}</td>
                            <td>${p.totalQty || 0}</td>
                            <td>${total.toLocaleString()}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            });
        }

        // ================= خروجی اکسل =================
        function exportTableToExcel(tableID, filename = '') {
            var table = document.getElementById(tableID);
            var wb = XLSX.utils.table_to_book(table, {sheet: "Sheet1"});
            XLSX.writeFile(wb, filename + '.xlsx');
        }

        // ================= خروجی PDF =================
        function exportToPDF(elementID, filename = '') {
            const element = document.getElementById(elementID);
            const opt = {
                margin:       10,
                filename:     filename + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = () => {
            if(localStorage.getItem('tailor_theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-icon').innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
            if(userPhone) {
                loadOrdersReport();
                loadProductionReport();
            }
        };
    </script>
</body>
</html>
