<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tailor | سفارشات پرچون</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --bg-body: radial-gradient(circle at top, #0a261d 0%, #050b09 100%);
            --bg-panel: linear-gradient(180deg, #0a1c16 0%, #040b09 100%);
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #78909c;
            --gold: #d4af37;
            --gold-light: #f3d58b;
            --border: rgba(212, 175, 55, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.4);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        body.light-mode {
            --bg-body: radial-gradient(circle at top, #f2ecd9 0%, #e6dec9 100%);
            --bg-panel: linear-gradient(180deg, #ffffff 0%, #f9f6f0 100%);
            --bg-card: rgba(0, 0, 0, 0.02);
            --text-main: #1c2b26;
            --text-muted: #6b7a73;
            --border: rgba(212, 175, 55, 0.5);
            --input-bg: #fdfcf9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; transition: background 0.3s, color 0.3s; }
        .app-container { width: 100%; max-width: 420px; padding: 15px; padding-bottom: 80px; position: relative; min-height: 100vh; display: flex; flex-direction: column; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; text-decoration: none; display: flex; align-items: center; }
        .header-title { color: var(--gold); font-weight: bold; font-size: 18px; }
        .theme-toggle { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--border); color: var(--gold); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .theme-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
        .input-box input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; color: var(--text-main); font-size: 13px; outline: none; transition: 0.3s; }
        .input-box input:focus { border-color: var(--gold); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-success { background: linear-gradient(90deg, #2ed573, #20b2aa); color: #fff; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3); }

        /* کارت نتیجه جستجو */
        .result-card { background: var(--bg-card); border: 1px solid var(--success); border-radius: 16px; padding: 15px; margin-top: 15px; display: none; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .result-code { font-size: 20px; font-weight: bold; color: var(--gold); letter-spacing: 2px; }
        .result-name { font-size: 14px; font-weight: bold; }
        .measurement-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .measurement-item { background: rgba(128,128,128,0.1); padding: 8px; border-radius: 8px; text-align: center; }
        .measurement-item span { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
        .measurement-item strong { font-size: 13px; color: var(--gold); }

        .custom-alert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .custom-alert-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-alert-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 85%; max-width: 300px; text-align: center; transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .custom-alert-overlay.active .custom-alert-box { transform: scale(1); }
        .custom-alert-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px; }
        .icon-success { background: rgba(46, 213, 115, 0.1); border: 2px solid var(--success); color: var(--success); }
        .icon-error { background: rgba(255, 71, 87, 0.1); border: 2px solid var(--danger); color: var(--danger); }
        .custom-alert-icon svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 3; }
        .custom-alert-title { color: var(--text-main); font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .custom-alert-msg { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; }
        .custom-alert-btn { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #000; font-weight: bold; font-size: 13px; border: none; border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="custom-alert-overlay" id="custom-alert">
        <div class="custom-alert-box">
            <div class="custom-alert-icon" id="alert-icon-box"><svg id="alert-icon-svg" viewBox="0 0 24 24"></svg></div>
            <h3 class="custom-alert-title" id="alert-title">عنوان</h3>
            <p class="custom-alert-msg" id="alert-msg">پیام</p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">تایید</button>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">➔</a>
            <div class="header-title">سفارشات پرچون</div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn"><svg id="theme-icon" viewBox="0 0 24 24"></svg></button>
        </div>

        <!-- بخش جستجو -->
        <div class="card" style="padding: 15px;">
            <div class="form-group" style="margin-bottom: 10px;">
                <label>جستجوی مشتری با کد ۵ رقمی</label>
                <div class="input-box" style="display: flex; gap: 10px;">
                    <input type="number" id="search-code" placeholder="مثلا 54321" style="text-align: center; letter-spacing: 5px; font-size: 16px; font-weight: bold;">
                    <button class="btn btn-primary" style="width: 80px; padding: 10px;" onclick="searchCustomer()">جستجو</button>
                </div>
            </div>
        </div>

        <!-- کارت نمایش نتیجه جستجو -->
        <div class="result-card" id="search-result">
            <div class="result-header">
                <div class="result-name" id="res-name">نام مشتری</div>
                <div class="result-code" id="res-code">00000</div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">
                شماره تماس: <span id="res-phone" style="color: var(--gold); font-weight: bold;"></span>
            </div>
            <div class="measurement-grid">
                <div class="measurement-item"><span>قد</span><strong id="res-qad">0</strong></div>
                <div class="measurement-item"><span>دوش</span><strong id="res-dosh">0</strong></div>
                <div class="measurement-item"><span>آستین</span><strong id="res-astin">0</strong></div>
                <div class="measurement-item"><span>سینه</span><strong id="res-sineh">0</strong></div>
                <div class="measurement-item"><span>کمر</span><strong id="res-kamar">0</strong></div>
                <div class="measurement-item"><span>کولان</span><strong id="res-kolan">0</strong></div>
            </div>
            <div style="margin-top: 10px; font-size: 11px; color: var(--text-muted);">
                نوع لباس: <span id="res-type" style="color: var(--gold);"></span> | 
                قیمت: <span id="res-price" style="color: var(--gold);"></span> افغانی
            </div>
        </div>

        <!-- فرم ثبت سفارش جدید -->
        <div class="card">
            <h3 style="color: var(--gold); font-size: 16px; margin-bottom: 15px; text-align: center;">ثبت سفارش جدید</h3>
            
            <div class="grid-2">
                <div class="form-group"><label>نام و تخلص</label><div class="input-box"><input type="text" id="c-name" placeholder="احمد رحیمی"></div></div>
                <div class="form-group"><label>شماره تماس</label><div class="input-box"><input type="tel" id="c-phone" placeholder="07XXXXXXXX"></div></div>
            </div>

            <div class="grid-3">
                <div class="form-group"><label>قد</label><div class="input-box"><input type="number" id="c-qad" placeholder="0"></div></div>
                <div class="form-group"><label>دوش</label><div class="input-box"><input type="number" id="c-dosh" placeholder="0"></div></div>
                <div class="form-group"><label>آستین</label><div class="input-box"><input type="number" id="c-astin" placeholder="0"></div></div>
                <div class="form-group"><label>سینه</label><div class="input-box"><input type="number" id="c-sineh" placeholder="0"></div></div>
                <div class="form-group"><label>کمر</label><div class="input-box"><input type="number" id="c-kamar" placeholder="0"></div></div>
                <div class="form-group"><label>کولان</label><div class="input-box"><input type="number" id="c-kolan" placeholder="0"></div></div>
            </div>

            <div class="grid-2">
                <div class="form-group"><label>نوع لباس</label><div class="input-box"><input type="text" id="c-type" placeholder="مثلا پیراهن"></div></div>
                <div class="form-group"><label>قیمت (افغانی)</label><div class="input-box"><input type="number" id="c-price" placeholder="0"></div></div>
            </div>

            <button class="btn btn-success" onclick="saveRetailOrder()">
                <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                ساخت کد ۵ رقمی و ذخیره
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDeuBpobxA5NNZZZ0ieu2-WLn-jJgxxdkk",
            authDomain: "tailor-64f7f.firebaseapp.com",
            databaseURL: "https://tailor-64f7f-default-rtdb.firebaseio.com",
            projectId: "tailor-64f7f",
            storageBucket: "tailor-64f7f.firebasestorage.app",
            messagingSenderId: "16067911685",
            appId: "1:16067911685:web:1b76892edf61b6a4923c6c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const userPhone = localStorage.getItem('tailor_user');

        function showAlert(type, title, msg) {
            const overlay = document.getElementById('custom-alert');
            const iconBox = document.getElementById('alert-icon-box');
            const iconSvg = document.getElementById('alert-icon-svg');
            if(type === 'success') {
                iconBox.className = 'custom-alert-icon icon-success';
                iconSvg.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
            } else {
                iconBox.className = 'custom-alert-icon icon-error';
                iconSvg.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
            }
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            overlay.classList.add('active');
        }
        function closeCustomAlert() { document.getElementById('custom-alert').classList.remove('active'); }

        // تابع تولید کد رندوم ۵ رقمی و بررسی تکراری نبودن
        function generateUniqueCode(callback) {
            const randomCode = Math.floor(10000 + Math.random() * 90000).toString();
            database.ref('users/' + userPhone + '/retail_orders/' + randomCode).once('value').then(snap => {
                if(snap.exists()) {
                    generateUniqueCode(callback); // اگر تکراری بود دوباره تولید کن
                } else {
                    callback(randomCode); // کد یکتا پیدا شد
                }
            });
        }

        function saveRetailOrder() {
            const name = document.getElementById('c-name').value.trim();
            if(!name) return showAlert('error', 'خطا', 'لطفاً نام مشتری را وارد کنید.');

            const phone = document.getElementById('c-phone').value.trim();
            const qad = document.getElementById('c-qad').value;
            const dosh = document.getElementById('c-dosh').value;
            const astin = document.getElementById('c-astin').value;
            const sineh = document.getElementById('c-sineh').value;
            const kamar = document.getElementById('c-kamar').value;
            const kolan = document.getElementById('c-kolan').value;
            const type = document.getElementById('c-type').value.trim();
            const price = document.getElementById('c-price').value;

            generateUniqueCode(function(code) {
                const orderData = {
                    code: code,
                    name: name,
                    phone: phone,
                    measurements: { qad, dosh, astin, sineh, kamar, kolan },
                    type: type || 'سایر',
                    price: Number(price) || 0,
                    date: new Date().toLocaleDateString('fa-IR'),
                    timestamp: Date.now()
                };

                database.ref('users/' + userPhone + '/retail_orders/' + code).set(orderData).then(() => {
                    showAlert('success', 'ثبت شد', `سفارش با موفقیت ثبت شد.\nکد مشتری: ${code}`);
                    // پاک کردن فرم
                    document.querySelectorAll('.card input').forEach(input => input.value = '');
                    // نمایش نتیجه
                    displayResult(orderData);
                }).catch(err => showAlert('error', 'خطا', err.message));
            });
        }

        function searchCustomer() {
            const code = document.getElementById('search-code').value.trim();
            if(!code) return showAlert('error', 'خطا', 'کد را وارد کنید.');

            database.ref('users/' + userPhone + '/retail_orders/' + code).once('value').then(snap => {
                if(snap.exists()) {
                    displayResult(snap.val());
                } else {
                    document.getElementById('search-result').style.display = 'none';
                    showAlert('error', 'یافت نشد', 'مشتری با این کد یافت نشد.');
                }
            });
        }

        function displayResult(data) {
            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-code').innerText = data.code;
            document.getElementById('res-phone').innerText = data.phone || '---';
            document.getElementById('res-qad').innerText = data.measurements.qad || '0';
            document.getElementById('res-dosh').innerText = data.measurements.dosh || '0';
            document.getElementById('res-astin').innerText = data.measurements.astin || '0';
            document.getElementById('res-sineh').innerText = data.measurements.sineh || '0';
            document.getElementById('res-kamar').innerText = data.measurements.kamar || '0';
            document.getElementById('res-kolan').innerText = data.measurements.kolan || '0';
            document.getElementById('res-type').innerText = data.type;
            document.getElementById('res-price').innerText = data.price;
            document.getElementById('search-result').style.display = 'block';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-icon').innerHTML = isLight ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            localStorage.setItem('tailor_theme', isLight ? 'light' : 'dark');
        }

        window.onload = () => {
            if(localStorage.getItem('tailor_theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-icon').innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
            if(!userPhone) window.location.href = 'index.html';
        };
    </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => console.log('SW reg')).catch(err => console.log('SW fail'));
    });
  }
  </script>
</body>
</html>
